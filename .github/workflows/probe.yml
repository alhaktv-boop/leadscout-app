name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_sources.py
      - name: Save result
        run: |
          git config user.name "probe-bot"; git config user.email "bot@users.noreply.github.com"
          git add scripts/probe_result.md
          git diff --cached --quiet || (git commit -m "probe result" && git pull --rebase -q && git push -q)
